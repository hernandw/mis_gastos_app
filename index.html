<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Gastos Pro - Control Financiero</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para el gráfico de torta -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Mis Gastos Pro</h1>
                    <p class="text-xs text-slate-400">Control mensual, cuentas, categorías y respaldo JSON/CSV</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <!-- Selector de Mes -->
                <input type="month" id="filtroMes" onchange="renderizarTodo()" class="bg-slate-800 text-slate-200 px-3 py-2 rounded-lg text-sm border border-slate-700 outline-none cursor-pointer">
                <!-- Botones Backup / Exportar / Importar -->
                <button onclick="exportarJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition border border-slate-700 flex items-center gap-1.5" title="Exportar Respaldo JSON">
                    <i class="fa-solid fa-file-code text-emerald-400"></i> JSON
                </button>
                <button onclick="exportarCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition border border-slate-700 flex items-center gap-1.5" title="Exportar CSV">
                    <i class="fa-solid fa-file-csv text-sky-400"></i> CSV
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition border border-slate-700 flex items-center gap-1.5 cursor-pointer" title="Importar Archivo">
                    <i class="fa-solid fa-upload text-amber-400"></i> Importar
                    <input type="file" id="inputFile" accept=".json,.csv" onchange="importarArchivo(event)" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Columna Izquierda: Cuentas y Gráfico de Torta -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Estado Financiero y Cuentas -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="fa-solid fa-piggy-bank text-emerald-400"></i> Cuentas y Saldos
                    </h2>
                    <button onclick="abrirModalCuenta()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-700">
                        <i class="fa-solid fa-plus"></i> Cuenta
                    </button>
                </div>
                
                <div class="grid grid-cols-2 gap-3 bg-slate-950 p-3.5 rounded-xl border border-slate-800/80">
                    <div>
                        <span class="text-xs text-slate-400 block">Total Ingresos Mes</span>
                        <span id="labelIngresos" class="text-emerald-400 font-bold text-base">$0</span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Total Gastos Mes</span>
                        <span id="labelGastos" class="text-rose-400 font-bold text-base">$0</span>
                    </div>
                </div>

                <div id="listaCuentas" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                    <!-- Dinámico -->
                </div>
            </div>

            <!-- Gráfico de Torta por Categorías -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col items-center">
                <h2 class="text-base font-semibold text-white w-full mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-emerald-400"></i> Gastos por Categoría
                </h2>
                <div class="w-64 h-64 relative flex items-center justify-center">
                    <canvas id="graficoTorta"></canvas>
                </div>
            </div>

        </div>

        <!-- Columna Derecha: Transacciones y Registro -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Formulario de Transacción con Regla de Ingresos -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-base font-semibold text-white mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-emerald-400"></i> Nueva Transacción
                </h2>
                
                <form id="formTransaccion" onsubmit="agregarTransaccion(event)" class="space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Tipo</label>
                            <select id="tipoTransaccion" onchange="actualizarSelectCategorias()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                                <option value="gasto">Gasto (-)</option>
                                <option value="ingreso">Ingreso (+)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Cuenta</label>
                            <select id="cuentaTransaccion" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                                <!-- Dinámico -->
                            </select>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-medium text-slate-400">Categoría</label>
                                <button type="button" onclick="abrirModalCategoria()" class="text-[10px] text-emerald-400 hover:underline">+ Nueva</button>
                            </div>
                            <select id="categoriaTransaccion" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                                <!-- Dinámico -->
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-400 mb-1">Título / Descripción</label>
                            <input type="text" id="tituloTransaccion" placeholder="Ej: Supermercado, Sueldo, Nafta..." required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Monto (CLP)</label>
                            <input type="number" id="montoTransaccion" placeholder="0" step="any" min="1" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/10">
                        <i class="fa-solid fa-check"></i> Registrar Transacción
                    </button>
                </form>
            </div>

            <!-- Listado de Transacciones del Mes -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="fa-solid fa-list text-emerald-400"></i> Movimientos del Mes
                    </h2>
                </div>

                <div class="overflow-x-auto max-h-80 overflow-y-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800 sticky top-0">
                            <tr>
                                <th class="p-2.5">Fecha</th>
                                <th class="p-2.5">Título</th>
                                <th class="p-2.5">Categoría / Cuenta</th>
                                <th class="p-2.5 text-right">Monto</th>
                                <th class="p-2.5 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTransacciones" class="divide-y divide-slate-800/60">
                            <!-- Dinámico -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Modal para Agregar Cuenta -->
    <div id="modalCuenta" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <h3 class="text-base font-semibold text-white">Agregar Nueva Cuenta</h3>
            <input type="text" id="nombreNuevaCuenta" placeholder="Ej: Cuenta Bancaria, Efectivo..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <div class="flex justify-end gap-2">
                <button onclick="cerrarModalCuenta()" class="px-4 py-2 rounded-xl text-sm bg-slate-800 text-slate-300">Cancelar</button>
                <button onclick="guardarNuevaCuenta()" class="px-4 py-2 rounded-xl text-sm bg-emerald-500 font-semibold text-slate-950">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar Categoría -->
    <div id="modalCategoria" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <h3 class="text-base font-semibold text-white">Agregar Nueva Categoría</h3>
            <input type="text" id="nombreNuevaCategoria" placeholder="Ej: Comida, Transporte, Ropa..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <div class="flex justify-end gap-2">
                <button onclick="cerrarModalCategoria()" class="px-4 py-2 rounded-xl text-sm bg-slate-800 text-slate-300">Cancelar</button>
                <button onclick="guardarNuevaCategoria()" class="px-4 py-2 rounded-xl text-sm bg-emerald-500 font-semibold text-slate-950">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Lógica de la Aplicación -->
    <script>
        let datosApp = {
            uuid: "app-gastos-local",
            label: "Mis Gastos Pro",
            currency: "CLP",
            openingBalance: 0,
            cuentas: [
                { id: '1', nombre: 'Cuenta Corriente' },
                { id: '2', nombre: 'Efectivo' }
            ],
            categorias: {
                gasto: ['Comida', 'Transporte', 'Alojamiento', 'Coche', 'Estudios', 'Salud', 'Seguro', 'Cuidados', 'Gastos profesionales'],
                ingreso: ['Sueldo', 'Freelance', 'Inversiones', 'Otros']
            },
            transacciones: []
        };

        let chartInstance = null;

        window.onload = function() {
            const hoy = new Date();
            const mesStr = hoy.toISOString().slice(0, 7);
            document.getElementById('filtroMes').value = mesStr;

            cargarLocalStorage();
            renderizarTodo();
        };

        function cargarLocalStorage() {
            const guardado = localStorage.getItem('mis_gastos_app_data');
            if (guardado) {
                try {
                    datosApp = JSON.parse(guardado);
                    if (!datosApp.cuentas) datosApp.cuentas = [{ id: '1', nombre: 'Principal' }];
                    if (!datosApp.categorias) datosApp.categorias = { gasto: ['Comida', 'Transporte'], ingreso: ['Sueldo'] };
                } catch(e) { console.error(e); }
            }
        }

        function guardarLocalStorage() {
            localStorage.setItem('mis_gastos_app_data', JSON.stringify(datosApp));
        }

        function abrirModalCuenta() { document.getElementById('modalCuenta').classList.remove('hidden'); document.getElementById('modalCuenta').classList.add('flex'); }
        function cerrarModalCuenta() { document.getElementById('modalCuenta').classList.remove('flex'); document.getElementById('modalCuenta').classList.add('hidden'); }
        function guardarNuevaCuenta() {
            const nombre = document.getElementById('nombreNuevaCuenta').value.trim();
            if (nombre) {
                datosApp.cuentas.push({ id: Date.now().toString(), nombre });
                document.getElementById('nombreNuevaCuenta').value = '';
                cerrarModalCuenta();
                renderizarTodo();
                guardarLocalStorage();
            }
        }

        function abrirModalCategoria() { document.getElementById('modalCategoria').classList.remove('hidden'); document.getElementById('modalCategoria').classList.add('flex'); }
        function cerrarModalCategoria() { document.getElementById('modalCategoria').classList.remove('flex'); document.getElementById('modalCategoria').classList.add('hidden'); }
        function guardarNuevaCategoria() {
            const nombre = document.getElementById('nombreNuevaCategoria').value.trim();
            const tipo = document.getElementById('tipoTransaccion').value;
            if (nombre && !datosApp.categorias[tipo].includes(nombre)) {
                datosApp.categorias[tipo].push(nombre);
                document.getElementById('nombreNuevaCategoria').value = '';
                cerrarModalCategoria();
                actualizarSelectCategorias();
                guardarLocalStorage();
            }
        }

        function actualizarSelectCategorias() {
            const tipo = document.getElementById('tipoTransaccion').value;
            const selectCat = document.getElementById('categoriaTransaccion');
            selectCat.innerHTML = '';
            datosApp.categorias[tipo].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                selectCat.appendChild(opt);
            });
        }

        // --- REGLA DE ORO: SI NO HAY INGRESOS NO PERMITIR GASTAR ---
        function agregarTransaccion(e) {
            e.preventDefault();
            const tipo = document.getElementById('tipoTransaccion').value;
            const cuentaId = document.getElementById('cuentaTransaccion').value;
            const categoria = document.getElementById('categoriaTransaccion').value;
            const titulo = document.getElementById('tituloTransaccion').value.trim();
            const montoInput = parseFloat(document.getElementById('montoTransaccion').value);

            // Calcular ingresos totales registrados históricos
            const ingresosTotales = datosApp.transacciones
                .filter(t => t.amount > 0)
                .reduce((acc, t) => acc + t.amount, 0);

            if (tipo === 'gasto' && ingresosTotales <= 0) {
                alert("⚠️ REGLA DE CONTROL ACTIVADA: No tienes ningún ingreso registrado en la aplicación. Debes registrar al menos un ingreso antes de poder realizar gastos.");
                return;
            }

            // Guardar monto positivo para ingreso, negativo para gasto (compatible con tu JSON)
            const amountFinal = tipo === 'ingreso' ? Math.abs(montoInput) : -Math.abs(montoInput);

            const nuevaTx = {
                uuid: 'tx-' + Date.now(),
                date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }),
                amount: amountFinal,
                category: [categoria],
                cuentaId: cuentaId,
                title: titulo,
                status: "UNRECONCILED"
            };

            datosApp.transacciones.push(nuevaTx);
            document.getElementById('tituloTransaccion').value = '';
            document.getElementById('montoTransaccion').value = '';
            renderizarTodo();
            guardarLocalStorage();
        }

        function eliminarTransaccion(uuid) {
            datosApp.transacciones = datosApp.transacciones.filter(t => t.uuid !== uuid);
            renderizarTodo();
            guardarLocalStorage();
        }

        function renderizarTodo() {
            actualizarSelectCategorias();

            const selectCuenta = document.getElementById('cuentaTransaccion');
            const listaCuentasDiv = document.getElementById('listaCuentas');
            selectCuenta.innerHTML = '';
            listaCuentasDiv.innerHTML = '';

            let saldosCuentas = {};
            datosApp.cuentas.forEach(c => { saldosCuentas[c.id] = 0; });

            const mesSeleccionado = document.getElementById('filtroMes').value; // YYYY-MM
            let ingresosMes = 0;
            let gastosMes = 0;
            let gastosPorCategoriaMes = {};

            datosApp.transacciones.forEach(t => {
                const cId = t.cuentaId || (datosApp.cuentas[0] ? datosApp.cuentas[0].id : '1');
                if (t.amount > 0) saldosCuentas[cId] = (saldosCuentas[cId] || 0) + t.amount;
                if (t.amount < 0) saldosCuentas[cId] = (saldosCuentas[cId] || 0) + t.amount; // suma negativo

                // Parsear fecha formato DD/MM/YYYY o YYYY-MM-DD
                let fechaIso = '';
                if (t.date.includes('/')) {
                    const partes = t.date.split('/');
                    if (partes.length === 3) fechaIso = `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
                } else {
                    fechaIso = t.date;
                }

                if (fechaIso.startsWith(mesSeleccionado)) {
                    if (t.amount > 0) ingresosMes += t.amount;
                    if (t.amount < 0) {
                        const valGasto = Math.abs(t.amount);
                        gastosMes += valGasto;
                        const catPrincipal = Array.isArray(t.category) ? t.category[0] : (t.category || 'General');
                        gastosPorCategoriaMes[catPrincipal] = (gastosPorCategoriaMes[catPrincipal] || 0) + valGasto;
                    }
                }
            });

            // Renderizar cuentas
            datosApp.cuentas.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.nombre;
                selectCuenta.appendChild(opt);

                const saldoCuenta = saldosCuentas[c.id] || 0;
                const div = document.createElement('div');
                div.className = "flex justify-between items-center text-xs bg-slate-950 px-3 py-2 rounded-lg border border-slate-800";
                div.innerHTML = `<span class="font-medium text-slate-300">${c.nombre}</span><span class="font-bold ${saldoCuenta >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${saldoCuenta.toLocaleString()} CLP</span>`;
                listaCuentasDiv.appendChild(div);
            });

            document.getElementById('labelIngresos').innerText = '$' + ingresosMes.toLocaleString() + ' CLP';
            document.getElementById('labelGastos').innerText = '$' + gastosMes.toLocaleString() + ' CLP';

            // Renderizar tabla
            const tbody = document.getElementById('tablaTransacciones');
            tbody.innerHTML = '';
            
            const txsMes = datosApp.transacciones.filter(t => {
                let fechaIso = '';
                if (t.date.includes('/')) {
                    const p = t.date.split('/');
                    if (p.length === 3) fechaIso = `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
                } else { fechaIso = t.date; }
                return fechaIso.startsWith(mesSeleccionado);
            });

            if (txsMes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500 italic text-xs">Sin transacciones registradas en este mes.</td></tr>';
            } else {
                txsMes.forEach(t => {
                    const esIngreso = t.amount > 0;
                    const catStr = Array.isArray(t.category) ? t.category.join(' > ') : (t.category || 'General');
                    const tituloTx = t.title || t.comment || 'Transacción';
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-slate-800/40 hover:bg-slate-950/40 text-xs";
                    tr.innerHTML = `
                        <td class="p-2.5 text-slate-400">${t.date}</td>
                        <td class="p-2.5 font-medium text-white">${tituloTx}</td>
                        <td class="p-2.5 text-slate-400"><span class="bg-slate-800 px-2 py-0.5 rounded">${catStr}</span></td>
                        <td class="p-2.5 text-right font-bold ${esIngreso ? 'text-emerald-400' : 'text-rose-400'}">${esIngreso ? '+' : ''}$${t.amount.toLocaleString()}</td>
                        <td class="p-2.5 text-center"><button onclick="eliminarTransaccion('${t.uuid}')" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            renderizarGraficoTorta(gastosPorCategoriaMes);
        }

        function renderizarGraficoTorta(gastosCat) {
            const ctx = document.getElementById('graficoTorta').getContext('2d');
            const labels = Object.keys(gastosCat);
            const data = Object.values(gastosCat);

            if (chartInstance) chartInstance.destroy();

            if (labels.length === 0) {
                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Sin gastos'],
                        datasets: [{ data: [1], backgroundColor: ['#1e293b'] }]
                    },
                    options: { plugins: { legend: { display: false } }, maintainAspectRatio: false }
                });
                return;
            }

            const colores = ['#10b981', '#38bdf8', '#f43f5e', '#fbbf24', '#a855f7', '#fb7185', '#34d399', '#818cf8', '#f97316'];

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colores.slice(0, labels.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 10, font: { size: 9 } } }
                    }
                }
            });
        }

        // --- EXPORTAR E IMPORTAR JSON / CSV ---
        function exportarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosApp, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `mis_gastos_respaldo_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function exportarCSV() {
            let csvContent = "data:text/csv;charset=utf-8,uuid,date,amount,category,title\n";
            datosApp.transacciones.forEach(t => {
                const catStr = Array.isArray(t.category) ? t.category.join('>') : t.category;
                const titulo = t.title || t.comment || '';
                csvContent += `${t.uuid},${t.date},${t.amount},"${catStr}","${titulo}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `mis_gastos_export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function importarArchivo(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const contenido = event.target.result;
                    if (file.name.endsWith('.json')) {
                        const parsed = JSON.parse(contenido);
                        if (parsed.transactions) {
                            datosApp = parsed;
                        } else {
                            datosApp.transacciones = parsed;
                        }
                        guardarLocalStorage();
                        renderizarTodo();
                        alert("¡Archivo JSON importado con éxito!");
                    } else if (file.name.endsWith('.csv')) {
                        alert("Archivo CSV leído correctamente.");
                    }
                } catch(err) {
                    alert("Error al procesar el archivo.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
